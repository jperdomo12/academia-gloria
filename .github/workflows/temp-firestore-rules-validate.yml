name: temp-firestore-rules-validate

on:
  push:
    branches:
      - feat/administracion-mi-camino

permissions:
  contents: read

jobs:
  validate-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar configuración temporal de Firebase
        run: |
          cat > firebase.json <<'JSON'
          {
            "firestore": {
              "rules": "compartido/firebase/FireStore Rules.txt"
            },
            "emulators": {
              "firestore": {
                "port": 8080
              }
            }
          }
          JSON

      - name: Compilar reglas mediante Firestore Emulator
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-academia "echo RULES_OK"
