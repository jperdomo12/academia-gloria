name: P3 PR Trigger

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fast-track/p3-misiones-cierre-mvp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-track/p3-misiones-cierre-mvp
          fetch-depth: 0

      - name: Ejecutar parche P3 declarado
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path('.github/workflows/p3-fast-track.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validaciones estáticas"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = dedent(source[start:end])
          exec(compile(script, 'p3-fast-track-extracted.py', 'exec'))
          PY

      - name: Validar cambios
        shell: bash
        run: |
          node --check compartido/api/academia.js
          node --check mi-universo/mis-tareas/mis-tareas.js
          grep -q 'leerHistorial: leerHistorialTarea' compartido/api/academia.js
          grep -q 'data-action="cancel"' mi-universo/mis-tareas/mis-tareas.js
          grep -q 'data-action="reopen"' mi-universo/mis-tareas/mis-tareas.js
          ! grep -q 'data-action="delete"' mi-universo/mis-tareas/mis-tareas.js
          git diff --check

      - name: Guardar bloque P3
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No hay cambios que guardar.'
            exit 0
          fi
          git config user.name 'Academia Fast Track'
          git config user.email 'actions@users.noreply.github.com'
          git add compartido/api/academia.js mi-universo/mis-tareas/mis-tareas.js
          git commit -m 'feat(misiones): cerrar cancelacion e historial MVP'
          git push origin HEAD:fast-track/p3-misiones-cierre-mvp
