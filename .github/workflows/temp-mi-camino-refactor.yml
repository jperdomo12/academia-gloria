name: temp-mi-camino-refactor

on:
  push:
    branches:
      - refactor/mi-camino-tareas-unica-escucha

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/mi-camino-tareas-unica-escucha

      - name: Consolidar observación de Misiones en index.html
        shell: python
        run: |
          from pathlib import Path

          path = Path('mi-universo/mi-camino/index.html')
          text = path.read_text(encoding='utf-8')

          import_academia = '    import { Academia } from "../../compartido/api/academia.js";'
          import_compartido = '    import { observarTareasCamino } from "./tareas-camino.js";'
          llamada_actual = '      return Academia.tareas.observar('
          llamada_nueva = '      return observarTareasCamino('

          if import_compartido not in text:
              assert text.count(import_academia) == 1, 'Import de Academia inesperado'
              text = text.replace(
                  import_academia,
                  import_academia + '\n' + import_compartido,
                  1
              )

          assert text.count(llamada_actual) == 1, 'La escucha directa esperada no es única'
          text = text.replace(llamada_actual, llamada_nueva, 1)
          path.write_text(text, encoding='utf-8')

      - name: Confirmar alcance del cambio
        run: |
          git diff --check
          git diff -- mi-universo/mi-camino/index.html
          test "$(git diff --numstat -- mi-universo/mi-camino/index.html | awk '{print $1+$2}')" -le 3

      - name: Guardar cambio en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mi-universo/mi-camino/index.html
          git commit -m "Refactor: conectar index con fuente compartida de Misiones"
          git push
