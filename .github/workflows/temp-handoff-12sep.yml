name: temp-handoff-12sep

on:
  push:
    branches:
      - docs/handoff-mi-camino-12sep

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/handoff-mi-camino-12sep

      - name: Actualizar HandOff
        run: python tools/temp_handoff_12sep.py

      - name: Validar actualización
        run: |
          git diff --check
          grep -q 'Versión.*2.3' docs/project/ACADEMIA_GLORIA_HANDOFF_PLANTILLA.md
          grep -q 'af3d936f660b9bb4d160c8ca10ad12166b274cea' docs/project/ACADEMIA_GLORIA_HANDOFF_PLANTILLA.md
          grep -q 'Refinamiento inmediato · Administración → Mi Camino' docs/project/ACADEMIA_GLORIA_HANDOFF_PLANTILLA.md

      - name: Guardar HandOff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/ACADEMIA_GLORIA_HANDOFF_PLANTILLA.md
          git commit -m "Docs: actualizar HandOff tras Mi Camino"
          git push
