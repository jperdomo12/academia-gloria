name: temp-admin-mi-camino-patch

on:
  push:
    branches:
      - feat/administracion-mi-camino

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/administracion-mi-camino

      - name: Integrar navegación, reglas y documentación propietaria
        shell: python
        run: |
          from pathlib import Path

          # Navegación administrativa
          path = Path('compartido/modelos/navegacion.js')
          text = path.read_text(encoding='utf-8')
          old = '''      {
                id: "gestion-usuarios",
                titulo: "Gestión de Usuarios",
                icono: "👥",
                ruta: "administracion/usuarios/",
                nivelMinimo: "administracion"
              }'''.replace('        ', '      ')
          # Mantener un ancla literal más simple para no depender de indentación generada.
          anchor = '''      {
                id: "gestion-usuarios",'''.replace('        ', '      ')
          if 'id: "administracion-mi-camino"' not in text:
              target = '''      {
                id: "gestion-usuarios",
                titulo: "Gestión de Usuarios",
                icono: "👥",
                ruta: "administracion/usuarios/",
                nivelMinimo: "administracion"
              }
'''.replace('        ', '      ')
              # La sustitución anterior puede no preservar exactamente el espaciado;
              # usar el bloque real de cuatro espacios si no encuentra el normalizado.
              target = '''      {
        id: "gestion-usuarios",
        titulo: "Gestión de Usuarios",
        icono: "👥",
        ruta: "administracion/usuarios/",
        nivelMinimo: "administracion"
      }
''' if target not in text else target
              replacement = target.rstrip() + ''',
      {
        id: "administracion-mi-camino",
        titulo: "Mi Camino",
        icono: "🌳",
        ruta: "administracion/mi-camino/",
        nivelMinimo: "administracion",
        cabeceraGlobal: true,
        limpiarNavegacionLegada: true
      }
'''
              assert target in text, 'No se encontró Gestión de Usuarios en navegación'
              text = text.replace(target, replacement, 1)
          path.write_text(text, encoding='utf-8')

          # Firestore Rules: configuración global de crecimiento.
          path = Path('compartido/firebase/FireStore Rules.txt')
          text = path.read_text(encoding='utf-8')
          if 'match /configuracion/{configId}' not in text:
              anchor = '    // LOGIN FUNCIONAL · Fase 1.6 / 1.8\n'
              block = '''    // CONFIGURACIÓN GLOBAL · MI CAMINO\n    //\n    // La configuración es legible por cualquier Usuario autenticado porque\n    // determina la presentación de crecimiento del alumno. Solo Administración\n    // puede modificarla y siempre conserva auditoría transversal.\n    function configuracionMiCaminoValida() {\n      let datos = request.resource.data;\n\n      return datos.keys().hasOnly([\n          "schemaVersion",\n          "etapas",\n          "reglasPeso",\n          "createdAt",\n          "createdBy",\n          "updatedAt",\n          "updatedBy"\n        ])\n        && datos.schemaVersion == 1\n        && datos.etapas is map\n        && datos.etapas.keys().hasOnly([\n          "semilla",\n          "brote",\n          "plantita",\n          "arbol-joven",\n          "arbol",\n          "arbol-con-frutos",\n          "arbol-lleno-de-frutos"\n        ])\n        && datos.etapas.semilla is int\n        && datos.etapas.semilla == 0\n        && datos.etapas.brote is int\n        && datos.etapas.plantita is int\n        && datos.etapas["arbol-joven"] is int\n        && datos.etapas.arbol is int\n        && datos.etapas["arbol-con-frutos"] is int\n        && datos.etapas["arbol-lleno-de-frutos"] is int\n        && datos.etapas.brote > datos.etapas.semilla\n        && datos.etapas.plantita > datos.etapas.brote\n        && datos.etapas["arbol-joven"] > datos.etapas.plantita\n        && datos.etapas.arbol > datos.etapas["arbol-joven"]\n        && datos.etapas["arbol-con-frutos"] > datos.etapas.arbol\n        && datos.etapas["arbol-lleno-de-frutos"] > datos.etapas["arbol-con-frutos"]\n        && datos.reglasPeso is map\n        && datos.reglasPeso.keys().hasOnly([\n          "cantidadEstandarMin",\n          "cantidadAmpliaMin",\n          "minutosEstandarMin",\n          "minutosAmpliaMin",\n          "repasoAcademicoComoEstandar",\n          "tareaCombinadaComoAmplia"\n        ])\n        && datos.reglasPeso.cantidadEstandarMin is int\n        && datos.reglasPeso.cantidadEstandarMin >= 1\n        && datos.reglasPeso.cantidadAmpliaMin is int\n        && datos.reglasPeso.cantidadAmpliaMin > datos.reglasPeso.cantidadEstandarMin\n        && datos.reglasPeso.minutosEstandarMin is int\n        && datos.reglasPeso.minutosEstandarMin >= 1\n        && datos.reglasPeso.minutosAmpliaMin is int\n        && datos.reglasPeso.minutosAmpliaMin > datos.reglasPeso.minutosEstandarMin\n        && datos.reglasPeso.repasoAcademicoComoEstandar is bool\n        && datos.reglasPeso.tareaCombinadaComoAmplia is bool\n        && datos.createdAt is timestamp\n        && datos.createdBy is string\n        && datos.updatedAt is timestamp\n        && datos.updatedBy is string;\n    }\n\n    match /configuracion/{configId} {\n      allow read: if configId == "miCamino" && estaAutenticado();\n\n      allow create: if configId == "miCamino"\n        && esAdministrador()\n        && configuracionMiCaminoValida()\n        && request.resource.data.createdAt == request.time\n        && request.resource.data.createdBy == request.auth.uid\n        && request.resource.data.updatedAt == request.time\n        && request.resource.data.updatedBy == request.auth.uid;\n\n      allow update: if configId == "miCamino"\n        && esAdministrador()\n        && configuracionMiCaminoValida()\n        && request.resource.data.createdAt == resource.data.createdAt\n        && request.resource.data.createdBy == resource.data.createdBy\n        && request.resource.data.updatedAt == request.time\n        && request.resource.data.updatedBy == request.auth.uid;\n\n      allow delete: if false;\n    }\n\n'''
              assert anchor in text, 'No se encontró ancla de LOGIN FUNCIONAL en Rules'
              text = text.replace(anchor, block + anchor, 1)
          path.write_text(text, encoding='utf-8')

          # Documento propietario de Motivación/Reconocimiento.
          path = Path('docs/product/DESIGN-SISTEMA_MOTIVACION_Y_RECONOCIMIENTO-v1.0.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('| **Versión del documento** | 1.1 |', '| **Versión del documento** | 1.2 |', 1)
          text = text.replace('| **Última actualización** | 03/09/2026 |', '| **Última actualización** | 12/09/2026 |', 1)
          history = '| Versión | Fecha | Responsables | Cambios |\n|---|---:|---|---|\n'
          if '| 1.2 | 12/09/2026 |' not in text:
              text = text.replace(
                  history,
                  history + '| 1.2 | 12/09/2026 | Juan Perdomo + AI Collaborator | Activa la mecánica real de crecimiento de Mi Camino con siete etapas, ponderación 1/2/3 basada en alcance observable, exclusión de datos de prueba y Administración → Mi Camino para auditoría, vista previa y configuración global con auditoría. La etapa sigue siendo derivada: no se persiste por Persona. |\n',
                  1
              )
          text = text.replace(
              '| E · Mecánica Semilla/Brote/Árbol | ⏳ Diseñada conceptualmente · no implementada |',
              '| E · Crecimiento visual de Mi Camino | ✅ Implementado · 7 etapas · ponderación configurable |',
              1
          )
          old_note = 'La representación **Semilla → Brote → Árbol** ya puede aparecer como lenguaje visual de crecimiento, pero eso no equivale a disponer de una mecánica automática que cambie etapas.'
          new_note = '''La mecánica de crecimiento visual está implementada y se deriva de Misiones reales completadas, visibles y no marcadas como prueba. Utiliza siete etapas —**Semilla → Brote → Plantita → Árbol joven → Árbol → Árbol con frutos → Árbol lleno de frutos**— y pesos 1/2/3 que representan únicamente alcance observable de la Misión, nunca valor personal, inteligencia o comparación entre alumnos.\n\nLa etapa no se guarda como dato de la Persona: se recalcula desde los hechos actuales y la configuración global. `Administración → Mi Camino` permite auditar cada contribución, previsualizar cambios y modificar umbrales/reglas de ponderación. La configuración persiste en `configuracion/miCamino` con `createdAt`, `createdBy`, `updatedAt` y `updatedBy`; los datos de prueba nunca aportan unidades.'''
          if old_note in text:
              text = text.replace(old_note, new_note, 1)
          path.write_text(text, encoding='utf-8')

          # Visión de Mi Camino: sincronizar presente sin convertirla en especificación.
          path = Path('docs/vision/08_MI_CAMINO.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('| **Versión** | 1.1 |', '| **Versión** | 1.2 |', 1)
          text = text.replace('| **Última actualización** | 04/09/2026 |', '| **Última actualización** | 12/09/2026 |', 1)
          history = '| Versión | Fecha | Responsables | Cambios |\n|---|---:|---|---|\n'
          if '| 1.2 | 12/09/2026 |' not in text:
              text = text.replace(
                  history,
                  history + '| 1.2 | 12/09/2026 | Juan Perdomo + AI Collaborator | Sincroniza la visión con el crecimiento visual real de siete etapas derivado de Misiones reales. Mantiene la configuración/auditoría fuera de la experiencia del alumno, bajo Administración, y preserva la prohibición de rankings, economía de puntos o valor personal basado en métricas. |\n',
                  1
              )
          anchor = 'La mecánica exacta pertenece al Sistema de Motivación y Reconocimiento.\n'
          addition = '''La implementación actual puede representar visualmente el crecimiento mediante siete etapas derivadas de actividad real. Las unidades internas son un mecanismo técnico para determinar la ilustración y el tramo actual; **no se presentan como una puntuación de valor personal ni una competición**. Las Misiones de prueba quedan excluidas.\n\nLa auditoría y configuración de esta mecánica vive separada en `Administración → Mi Camino`, protegida por nivel `administracion`; no convierte Mi Camino en una consola administrativa.\n'''
          if addition not in text:
              assert anchor in text, 'No se encontró ancla de mecánica en visión Mi Camino'
              text = text.replace(anchor, anchor + '\n' + addition, 1)
          text = text.replace(
              '| **Crecimiento visible** | Reconocimientos y Guacamayas mediante sistema propietario |',
              '| **Crecimiento visible** | Reconocimientos/Guacamayas + 7 etapas derivadas de Misiones reales |',
              1
          )
          path.write_text(text, encoding='utf-8')

      - name: Validar cambios básicos
        run: |
          node --check compartido/modelos/navegacion.js
          git diff --check
          grep -q 'administracion-mi-camino' compartido/modelos/navegacion.js
          grep -q 'match /configuracion/{configId}' 'compartido/firebase/FireStore Rules.txt'
          grep -q 'Versión del documento.*1.2' docs/product/DESIGN-SISTEMA_MOTIVACION_Y_RECONOCIMIENTO-v1.0.md

      - name: Guardar integración
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compartido/modelos/navegacion.js 'compartido/firebase/FireStore Rules.txt' docs/product/DESIGN-SISTEMA_MOTIVACION_Y_RECONOCIMIENTO-v1.0.md docs/vision/08_MI_CAMINO.md
          git commit -m "Feat: integrar Administración de Mi Camino"
          git push
