<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Descubre la Academia | Academia Gloria Valentina</title>
<meta name="description" content="Guía breve y visual para descubrir la Academia.">
<meta name="theme-color" content="#7c3aed">
<link rel="icon" type="image/png" href="../assets/iconos/icono-principal.png?v=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../compartido/css/academia-base.css">
<link rel="stylesheet" href="./guia.css">
<style>
.guide-quick-access{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:46px;
  padding:10px 15px;
  border:2px solid #ddd6fe;
  border-radius:16px;
  background:linear-gradient(100deg,#fff7ed,#faf5ff,#f0f9ff);
  color:#6d28d9;
  box-shadow:0 9px 22px rgba(76,29,149,.08);
  text-decoration:none;
  font-weight:900;
  white-space:nowrap;
}
.guide-quick-access:hover,
.guide-quick-access:focus-visible{
  border-color:#c4b5fd;
  box-shadow:0 12px 26px rgba(76,29,149,.13);
  outline:none;
}
@media(max-width:820px){
  .guide-quick-access{width:100%}
}
</style>
</head>
<body>
<main class="guide-shell">
<header class="guide-topbar">
<button
  id="backButton"
  class="boton-volver"
  type="button"
  data-accion-volver
  data-ruta-alternativa="../"
>← Volver</button>
<a class="guide-quick-access" href="./guia-rapida.html">📘 Guía rápida · Empieza aquí →</a>
</header>

<section class="guide-frame" aria-labelledby="guideTitle">
<div class="guide-progress" aria-hidden="true"><span id="progressBar"></span></div>
<div class="guide-counter"><span id="slideCounter">1 de 8</span></div>
<article id="slideContent" class="guide-slide" tabindex="-1">
<div class="guide-loading"><span>🌈</span><p>Preparando la aventura...</p></div>
</article>

<nav class="guide-actions" aria-label="Navegación de la guía">
<button id="previousButton" class="guide-button guide-button--secondary" type="button">← Anterior</button>
<div id="dotNavigation" class="guide-dots" aria-label="Secciones de la guía"></div>
<button id="nextButton" class="guide-button guide-button--primary" type="button">Siguiente →</button>
</nav>
</section>

<p class="guide-hint">Puedes volver a esta guía cuando quieras desde las páginas principales de la Academia.</p>
</main>
<script src="../compartido/js/navegacion.js"></script>
<script type="module" src="./guia.js"></script>
</body>
</html>
