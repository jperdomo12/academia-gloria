<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detalle de historia | Detectives</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../../compartido/css/academia-base.css"><link rel="stylesheet" href="../../../compartido/css/panel-usuario.css">
<style>*{box-sizing:border-box}body{margin:0;font-family:Outfit,sans-serif;color:#243047;background:linear-gradient(150deg,#eff6ff,#fff7ed,#faf5ff);min-height:100vh}.wrap{width:min(1000px,calc(100% - 28px));margin:auto;padding:20px 0 48px}.card{background:#fff;border:2px solid #e7eaf8;border-radius:25px;box-shadow:0 18px 42px rgba(76,29,149,.08);padding:22px;margin-bottom:16px}.topbar,.actions,.session-head{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.back,.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:11px 16px;border:0;border-radius:16px;font-weight:900;text-decoration:none;cursor:pointer}.back,.btn-light{background:#eef2ff;color:#4f46e5}.btn-primary{background:linear-gradient(90deg,#7c3aed,#ec4899);color:white}.btn-danger{background:#fff1f2;color:#be123c;border:2px solid #fecdd3}.title{font-size:clamp(34px,5vw,52px);margin:5px 0;color:#6d28d9}.story{font-size:24px;line-height:1.5;font-weight:800;padding:18px;border-radius:18px;background:#f0f9ff}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:6px 10px;border-radius:999px;background:#f1f5f9;font-weight:900;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{text-align:center;padding:15px;border-radius:18px;background:#faf5ff}.stat strong{display:block;font-size:30px;color:#7c3aed}.session{border-top:2px dashed #e2e8f0;padding:16px 0}.session:first-child{border-top:0}.answer-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.answer{padding:12px;border-radius:14px;background:#f8fafc}.muted{color:#64748b;font-weight:700}.error{text-align:center;color:#9f1239;font-weight:800}@media(max-width:650px){.grid,.answer-grid{grid-template-columns:1fr}.actions .btn{width:100%}}.session.session-highlight{border:3px solid #7c3aed;border-radius:18px;padding:16px;background:#faf5ff;box-shadow:0 0 0 5px rgba(124,58,237,.10)}</style></head>
<body><main class="wrap"><div class="topbar"><a class="back" data-volver-modulo data-ruta-alternativa="./historial.html" href="./historial.html">← Volver al historial</a><div data-panel-usuario></div></div><div id="content"><section class="card">Cargando historia…</section></div></main>
<script type="module">
import {auth} from "../../../compartido/firebase/firebase-config.js";import{iniciarPanelUsuario}from"../../../compartido/js/panel-usuario.js";import{obtenerProgresoHistoria,obtenerSesionesHistoria,reiniciarProgresoHistoria,eliminarSesionHistoria,marcarEstadoHistoria}from"../../../compartido/js/detectives-progreso.js";
await auth.authStateReady();if(!auth.currentUser){location.replace("/academia-gloria/login.html");throw new Error("Sesión no disponible");}await iniciarPanelUsuario({contenedor:"[data-panel-usuario]",loginUrl:"/academia-gloria/login.html",mostrarPerfil:false});
const params=new URLSearchParams(location.search);const id=params.get("id");const sesionObjetivo=params.get("sesionId");const content=document.getElementById("content");const escape=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[c]);const date=v=>v?new Date(v).toLocaleString("es-ES",{dateStyle:"medium",timeStyle:"short"}):"—";
if(!id){content.innerHTML='<section class="card error">No se indicó una historia.</section>';throw new Error("Falta id");}
async function load(){try{const response=await fetch("./historias.json",{cache:"no-store"});const stories=response.ok?await response.json():[];const story=stories.find(item=>item.id===id);const [progress,sessions]=await Promise.all([obtenerProgresoHistoria(auth.currentUser.uid,id),obtenerSesionesHistoria(auth.currentUser.uid,id)]);if(!story){content.innerHTML='<section class="card error">La historia ya no existe en historias.json.</section>';return;}render(story,progress,sessions);}catch(error){console.error(error);content.innerHTML='<section class="card error">No fue posible cargar el detalle.</section>';}}
function render(story,progress,sessions){content.innerHTML=`<section class="card"><div class="chips"><span class="chip">Nivel ${story.nivel}</span><span class="chip">${escape(story.tema)}</span><span class="chip">${escape(story.tipo)}</span></div><h1 class="title">${escape(story.titulo)}</h1><p class="story">${escape(story.texto)}</p><div class="actions"><a class="btn btn-primary" href="./index.html?practicar=${encodeURIComponent(story.id)}" data-conservar-retorno>Practicar otra vez</a><select id="stateSelect" class="btn btn-light"><option value="en_practica">En práctica</option><option value="reforzar">Reforzar</option><option value="dominada">Dominada</option></select><button id="resetButton" class="btn btn-danger">Reiniciar progreso</button></div></section>
<section class="card"><h2>📈 Resumen de aprendizaje</h2><div class="grid"><div class="stat"><strong>${Number(progress?.vecesCompletada||0)}</strong><span>Veces completada</span></div><div class="stat"><strong>${progress?.mejorIntentos??"—"}</strong><span>Mejor número de intentos</span></div><div class="stat"><strong>${progress?.pistasUltimaSesion??0}</strong><span>Pistas en la última sesión</span></div></div><p class="muted">Primera resolución: ${escape(date(progress?.primeraResolucion))}<br>Última resolución: ${escape(date(progress?.ultimaResolucion))}</p></section>
<section class="card"><h2>🧠 Contenido correcto</h2>${story.pasos.map((step,index)=>`<div class="session"><strong>Paso ${index+1}: ${escape(step.pregunta)}</strong><div class="answer-grid"><div class="answer">Operación: <strong>${escape(step.operacion)}</strong></div><div class="answer">Números: <strong>${step.a} y ${step.b}</strong></div><div class="answer">Resultado: <strong>${step.resultado}</strong></div></div></div>`).join("")}</section>
<section class="card"><h2>🗂️ Sesiones registradas</h2><div id="sessions">${sessions.length?sessions.map((session,index)=>`<article class="session" id="sesion-${escape(session.id)}" data-session-id="${escape(session.id)}"><div class="session-head"><strong>Resolución ${sessions.length-index} · ${escape(date(session.completadaEn))}</strong><button class="btn btn-danger delete-session" data-session="${escape(session.id)}">Eliminar</button></div><div class="answer-grid"><div class="answer">Intentos: <strong>${Number(session.intentosTotales||0)}</strong></div><div class="answer">Pistas: <strong>${Number(session.pistasUtilizadas||0)}</strong></div><div class="answer">Operación indicada: <strong>${escape(session.operacionIndicada||"—")}</strong></div><div class="answer">Números indicados: <strong>${escape((session.operandosIndicados||[]).join(" y ")||"—")}</strong></div><div class="answer">Resultado indicado: <strong>${session.resultadoIndicado??"—"}</strong></div></div></article>`).join(""):'<p class="muted">Todavía no hay sesiones registradas.</p>'}</div></section>`;
window.Academia?.navegacion?.prepararEnlaces();
const select=document.getElementById("stateSelect");select.value=progress?.estado||"en_practica";select.onchange=()=>marcarEstadoHistoria(auth.currentUser.uid,id,select.value);document.getElementById("resetButton").onclick=async()=>{if(!confirm("¿Reiniciar todo el progreso de esta historia?"))return;await reiniciarProgresoHistoria(auth.currentUser.uid,id);location.href="./historial.html";};document.querySelectorAll(".delete-session").forEach(button=>button.onclick=async()=>{if(!confirm("¿Eliminar esta resolución concreta?"))return;await eliminarSesionHistoria(auth.currentUser.uid,id,button.dataset.session);await load();});if(sesionObjetivo){const objetivo=document.querySelector(`[data-session-id="${CSS.escape(sesionObjetivo)}"]`);if(objetivo){objetivo.classList.add("session-highlight");setTimeout(()=>objetivo.scrollIntoView({behavior:"smooth",block:"center"}),100);}}}
await load();
</script><script src="../../../compartido/js/navegacion.js"></script></body></html>
