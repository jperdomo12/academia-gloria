<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Detalle de historia | Detectives</title>
  <link rel="icon" type="image/png" href="../../../assets/iconos/icono-principal.png">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../compartido/css/academia-base.css">
  <link rel="stylesheet" href="../../../compartido/css/panel-usuario.css">
  <link rel="stylesheet" href="../../../compartido/css/navegacion-global.css">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Outfit,sans-serif;color:#243047;background:linear-gradient(150deg,#eff6ff,#fff7ed,#faf5ff);min-height:100vh}
    .wrap{width:min(1040px,calc(100% - 28px));margin:auto;padding:20px 0 48px}
    .card{background:#fff;border:2px solid #e7eaf8;border-radius:25px;box-shadow:0 18px 42px rgba(76,29,149,.08);padding:22px;margin-bottom:16px}
    .topbar,.actions,.session-head{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .back,.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:11px 16px;border:0;border-radius:16px;font-weight:900;text-decoration:none;cursor:pointer}
    .back,.btn-light{background:#eef2ff;color:#4f46e5}.btn-primary{background:linear-gradient(90deg,#7c3aed,#ec4899);color:white}
    .btn-danger{background:#fff1f2;color:#be123c;border:2px solid #fecdd3}
    .title{font-size:clamp(34px,5vw,52px);margin:5px 0;color:#6d28d9}.story{font-size:22px;line-height:1.5;font-weight:800;padding:18px;border-radius:18px;background:#f0f9ff}
    .chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:6px 10px;border-radius:999px;background:#f1f5f9;font-weight:900;font-size:13px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{text-align:center;padding:15px;border-radius:18px;background:#faf5ff}.stat strong{display:block;font-size:30px;color:#7c3aed}
    .process{display:grid;gap:11px}.process-step{padding:15px;border-radius:17px;background:#f8fafc;border-left:6px solid #c4b5fd}
    .process-step h3{margin:0 0 8px;font-size:19px}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#475569;font-weight:750}
    .resolution{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}.value{padding:12px;border-radius:14px;background:#fff;border:2px solid #e2e8f0}.value span{display:block;color:#64748b;font-size:13px;font-weight:800}
    .session{border-top:2px dashed #e2e8f0;padding:18px 0}.session:first-child{border-top:0}.muted{color:#64748b;font-weight:700}.error{text-align:center;color:#9f1239;font-weight:800}
    select.btn{appearance:auto}@media(max-width:680px){.grid,.resolution{grid-template-columns:1fr}.actions .btn{width:100%}}
  </style>
</head>
<body>
<main class="wrap">
  <div class="topbar">
    <a class="back" data-volver-modulo data-ruta-alternativa="./historial.html" href="./historial.html">← Volver</a>
    <div data-panel-usuario></div>
  </div>
  <div id="content"><section class="card">Cargando historia…</section></div>
</main>
<script type="module">
  import {auth} from "../../../compartido/firebase/firebase-config.js";
  import {iniciarPanelUsuario} from "../../../compartido/js/panel-usuario.js";
  import {ContextoUsuario} from "../../../compartido/js/contexto-usuario.js";
  import {
    obtenerProgresoHistoria,obtenerSesionesHistoria,obtenerSesionHistoria,
    reiniciarProgresoHistoria,eliminarSesionHistoria,marcarEstadoHistoria
  } from "../../../compartido/js/detectives-progreso.js";

  await auth.authStateReady();
  if(!auth.currentUser){location.replace("/academia-gloria/login.html");throw new Error("Sesión no disponible");}
  const contexto=await ContextoUsuario.inicializar();
  const userIdDatos=contexto.userIdPersonaActiva||auth.currentUser.uid;
  await iniciarPanelUsuario({contenedor:"[data-panel-usuario]",loginUrl:"/academia-gloria/login.html",mostrarPerfil:false});

  const params=new URLSearchParams(location.search);
  const id=params.get("id");
  const sesionObjetivo=params.get("sesionId");
  const misionId=params.get("misionId");
  const modoRevisionMision=Boolean(misionId && sesionObjetivo);
  const content=document.getElementById("content");
  const escape=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[c]);
  const date=value=>value?new Date(value).toLocaleString("es-ES",{dateStyle:"medium",timeStyle:"short"}):"—";
  const duration=seconds=>{
    const value=Number(seconds||0);if(!value)return "No disponible";
    const minutes=Math.floor(value/60),rest=Math.round(value%60);
    return minutes?`${minutes} min ${rest?`${rest} s`:""}`.trim():`${rest} s`;
  };
  const optionText=(section,answer,savedText="")=>{
    if(String(savedText||"").trim()) return savedText;
    return section?.opciones?.find(item=>item.id===answer)?.texto ||
      section?.opciones?.find(item=>item.id===section?.correcta)?.texto ||
      "Respuesta no disponible";
  };
  const operationText=value=>({sumar:"Sumar",restar:"Restar",multiplicar:"Multiplicar",dividir:"Dividir"}[value]||value||"—");
  const intentosMinimosHistoria=story=>{
    const pasos=Array.isArray(story?.pasos)&&story.pasos.length
      ? story.pasos.length
      : 1;
    return 2+(pasos*3);
  };

  if(!id){content.innerHTML='<section class="card error">No se indicó una historia.</section>';throw new Error("Falta id");}

  function templateProcess(story){
    const math=story.pasos.map((step,index)=>`
      <article class="process-step">
        <h3>${story.pasos.length>1?`Paso matemático ${index+1}`:"3. Elijo y 4. Resuelvo"} · ${escape(step.pregunta)}</h3>
        <div class="resolution">
          <div class="value"><span>Operación correcta</span><strong>${escape(operationText(step.operacion))}</strong></div>
          <div class="value"><span>Números correctos</span><strong>${step.a} y ${step.b}</strong></div>
          <div class="value"><span>Resultado correcto</span><strong>${step.resultado}</strong></div>
        </div>
      </article>`).join("");
    return `
      <article class="process-step"><h3>1. Comprendo · ${escape(story.comprension.pregunta)}</h3>
        <div class="row"><span>Respuesta correcta: ${escape(optionText(story.comprension,story.comprension.correcta))}</span></div></article>
      <article class="process-step"><h3>2. Descubro · ${escape(story.descubrimiento.pregunta)}</h3>
        <div class="row"><span>Respuesta correcta: ${escape(optionText(story.descubrimiento,story.descubrimiento.correcta))}</span></div></article>
      ${math}`;
  }

  function sessionProcess(story,session){
    const math=story.pasos.map((step,index)=>{
      const item=session.pasos?.[index]||{};
      return `<article class="process-step">
        <h3>${story.pasos.length>1?`Paso matemático ${index+1}`:"3. Elijo y 4. Resuelvo"} · ${escape(step.pregunta)}</h3>
        <div class="row"><span>Operación elegida: ${escape(operationText(item.operacionIndicada||session.operacionIndicada))}</span><strong>Intentos: ${Number(item.intentosOperacion||0)||"—"}</strong></div>
        <div class="resolution">
          <div class="value"><span>Números confirmados</span><strong>${escape((item.operandosIndicados||session.operandosIndicados||[]).join(" y ")||"—")}</strong><small>Intentos: ${Number(item.intentosOperandos||0)||"—"}</small></div>
          <div class="value"><span>Resultado confirmado</span><strong>${item.resultadoIndicado??session.resultadoIndicado??"—"}</strong><small>Intentos: ${Number(item.intentosResultado||0)||"—"}</small></div>
          <div class="value"><span>Tiempo Activo</span><strong>${escape(duration(session.tiempoActivoSegundos))}</strong></div>
        </div>
      </article>`;
    }).join("");
    return `
      <article class="process-step"><h3>1. Comprendo · ${escape(story.comprension.pregunta)}</h3>
        <div class="row"><span>Respuesta final: ${escape(optionText(
          story.comprension,
          session.respuestaComprension,
          session.respuestaComprensionTexto
        ))}</span><strong>Intentos: ${Number(session.intentosComprension||0)||"—"}</strong></div></article>
      <article class="process-step"><h3>2. Descubro · ${escape(story.descubrimiento.pregunta)}</h3>
        <div class="row"><span>Respuesta final: ${escape(optionText(
          story.descubrimiento,
          session.respuestaDescubrimiento,
          session.respuestaDescubrimientoTexto
        ))}</span><strong>Intentos: ${Number(session.intentosDescubrimiento||0)||"—"}</strong></div></article>
      ${math}`;
  }

  async function obtenerSesionesParaVista(){
    if(modoRevisionMision){
      const sesion=await obtenerSesionHistoria(userIdDatos,id,sesionObjetivo);
      return sesion?[sesion]:[];
    }
    return obtenerSesionesHistoria(userIdDatos,id);
  }

  async function load(){
    try{
      const response=await fetch("./historias.json",{cache:"no-store"});
      const stories=response.ok?await response.json():[];
      const story=stories.find(item=>item.id===id);
      const [progress,sessions]=await Promise.all([
        obtenerProgresoHistoria(userIdDatos,id),
        obtenerSesionesParaVista()
      ]);
      if(!story){content.innerHTML='<section class="card error">La historia ya no existe en historias.json.</section>';return;}

      content.innerHTML=`
        <section class="card">
          <div class="chips"><span class="chip">Nivel ${story.nivel}</span><span class="chip">${escape(story.tema)}</span><span class="chip">${escape(story.tipo)}</span></div>
          <h1 class="title">${escape(story.titulo)}</h1><p class="story">${escape(story.texto)}</p>
          ${modoRevisionMision
            ? `<p class="muted">🔒 Estás revisando una resolución conservada como trabajo realizado de la misión. Los datos del alumno son de solo lectura.</p>`
            : `
              <div class="actions">
                <a class="btn btn-primary" href="./index.html?practicar=${encodeURIComponent(story.id)}" data-conservar-retorno>Practicar otra vez</a>
                <select id="stateSelect" class="btn btn-light">
                  <option value="en_practica">En práctica</option><option value="reforzar">Reforzar</option><option value="dominada">Dominada</option>
                </select>
                <button id="resetButton" class="btn btn-danger">Reiniciar progreso</button>
              </div>
            `
          }
        </section>
        <section class="card"><h2>📈 Resumen de aprendizaje</h2>
          <div class="grid">
            <div class="stat"><strong>${Number(progress?.vecesCompletada||0)}</strong><span>Veces completada</span></div>
            <div class="stat"><strong>${intentosMinimosHistoria(story)}</strong><span>Intentos mínimos</span></div>
            <div class="stat"><strong>${progress?.mejorIntentos??"—"}</strong><span>Mejor número de intentos</span></div>
          </div>
          <p class="muted">Primera resolución: ${escape(date(progress?.primeraResolucion))}<br>Última resolución: ${escape(date(progress?.ultimaResolucion))}</p>
        </section>
        <section class="card"><h2>🧠 Contenido correcto</h2><div class="process">${templateProcess(story)}</div></section>
        <section class="card"><h2>${modoRevisionMision?"🗂️ Resolución de la misión":"🗂️ Sesiones registradas"}</h2>
          <div id="sessions">${sessions.length?sessions.map((session,index)=>`
            <article class="session" data-session-id="${escape(session.id)}">
              <div class="session-head"><strong>${modoRevisionMision?"Resolución guardada":`Resolución ${sessions.length-index}`} · ${escape(date(session.completadaEn))}</strong>
              ${modoRevisionMision
                ? ""
                : `<button class="btn btn-danger delete-session" data-session="${escape(session.id)}">Eliminar</button>`
              }</div>
              <div class="process">${sessionProcess(story,session)}</div>
            </article>`).join(""):`<p class="muted">${modoRevisionMision?"No se encontró la resolución guardada para esta misión.":"Todavía no hay sesiones registradas."}</p>`}
          </div>
        </section>`;

      window.Academia?.navegacion?.prepararEnlaces();

      if(!modoRevisionMision){
        const select=document.getElementById("stateSelect");
        const resetButton=document.getElementById("resetButton");

        if(select){
          select.value=progress?.estado||"en_practica";
          select.onchange=async()=>{
            try{
              await marcarEstadoHistoria(userIdDatos,id,select.value);
            }catch(error){
              console.error(error);
              alert(`No se pudo cambiar el estado de la historia.\nRazón: ${error.message}`);
            }
          };
        }

        if(resetButton){
          resetButton.onclick=async()=>{
            if(!confirm("¿Reiniciar todo el progreso de esta historia?"))return;
            try{
              await reiniciarProgresoHistoria(userIdDatos,id);
              location.href="./historial.html";
            }catch(error){
              console.error(error);
              alert(`No se pudo reiniciar el progreso.\nRazón: ${error.message}`);
            }
          };
        }

        document.querySelectorAll(".delete-session").forEach(button=>button.onclick=async()=>{
          if(!confirm("¿Eliminar esta resolución concreta?"))return;
          button.disabled=true;
          try{
            await eliminarSesionHistoria(userIdDatos,id,button.dataset.session);
            await load();
          }catch(error){
            console.error(error);
            alert(`No se pudo eliminar la resolución.\nRazón: ${error.message}`);
            button.disabled=false;
          }
        });
      }
      if(sesionObjetivo){
        const target=document.querySelector(`[data-session-id="${CSS.escape(sesionObjetivo)}"]`);
        if(target)setTimeout(()=>target.scrollIntoView({behavior:"smooth",block:"center"}),100);
      }
    }catch(error){
      console.error(error);
      content.innerHTML=`<section class="card error">No fue posible cargar el detalle.<br>Razón: ${escape(error.message || "Error no identificado")}</section>`;
    }
  }
  await load();
</script>
<script src="../../../compartido/js/navegacion.js"></script>
<script type="module" src="../../../compartido/componentes/navegacion-global.js"></script>
</body></html>
